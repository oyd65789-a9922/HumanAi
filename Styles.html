<style>
/* ==========================================================================
   SCENT LAB — 익명 향수 인식 조사 스타일시트 (Google Apps Script 배포용)
   ========================================================================== */

:root {
  --bg-color: #FAF8F5;
  --surface-color: #FFFFFF;
  --surface-alt: #F4EFEB;
  --surface-card: #FFFFFF;

  --danger-color: #B93838;
  --danger-bg: #FDF2F2;
  --danger-border: #F6C6C6;
  --success-color: #2E7D32;
  --success-bg: #F1F8F2;
  --font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", "Noto Sans KR", sans-serif;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-pill: 9999px;

  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);

  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #171717;
    --surface-color: #212121;
    --surface-alt: #2B2A28;
    --surface-card: #242424;
    --text-primary: #F0EDE8;
    --text-secondary: #B5B0AA;
    --text-muted: #7E7974;
    --border-color: #383633;
    --border-focus: #D0C9C0;
    --accent-color: #B09F90;
    --accent-hover: #C5B6A8;
    --accent-light: #2D2925;
    --accent-contrast: #181716;
    --danger-color: #E57373;
    --danger-bg: #2C1A1A;
    --danger-border: #522727;
    --success-color: #81C784;
    --success-bg: #1B291D;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {

  color: var(--text-primary);
  line-height: 1.6;

  flex-direction: column;

.skip-link {

.app-header {

.header-container { max-width: 1080px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }

.app-main { flex: 1; max-width: 1080px; width: 100%; margin: 0 auto; padding: 24px 16px 64px; }

.view-panel { display: none; }
.view-panel.active { display: block; animation: fadeIn 0.3s ease-out; }

@keyframes fadeIn {

.landing-card {

  padding: 48px 32px;

.landing-title { font-size: 2.1rem; font-weight: 700; line-height: 1.3; margin-bottom: 16px; letter-spacing: -0.02em; }
.landing-desc { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.6; }

.meta-badges { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }
.meta-item { background-color: var(--surface-alt); padding: 8px 16px; border-radius: var(--radius-md); font-size: 0.88rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }

.privacy-notice-box {

  border-radius: 0 var(--radius-md) var(--radius-md) 0; text-align: left; margin-bottom: 36px; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.65;

.start-btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }

.survey-header-bar { margin-bottom: 24px; }
.progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.88rem; color: var(--text-secondary); }
.progress-track { width: 100%; height: 6px; background-color: var(--border-color); border-radius: var(--radius-pill); overflow: hidden; }
.progress-fill { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

.survey-layout-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }

.reference-panel { background-color: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); }

.ref-accordion-trigger { width: 100%; background: none; border: none; display: flex; justify-content: space-between; align-items: center; font-size: 1rem; font-weight: 700; color: var(--text-primary); cursor: pointer; padding: 0; }
.ref-accordion-trigger[aria-expanded="true"] .ref-accordion-icon { transform: rotate(180deg); }
.ref-body { margin-top: 16px; }
.ref-note { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }

.scent-card-stack { display: flex; flex-direction: column; gap: 14px; }
.scent-spec-card { background-color: var(--surface-alt); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px; }
.scent-spec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.scent-tag { font-size: 0.78rem; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-sm); background-color: var(--surface-card); border: 1px solid var(--border-color); color: var(--text-primary); }
.scent-type-label { font-size: 0.8rem; color: var(--text-muted); }
.scent-text { font-size: 0.94rem; line-height: 1.6; color: var(--text-primary); }

.survey-content-panel { display: flex; flex-direction: column; gap: 24px; }
.section-wrapper { display: none; }
.section-wrapper.active { display: block; animation: fadeIn 0.25s ease-out; }

.question-card { background-color: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
.question-fieldset { border: none; padding: 0; margin: 0; }
.question-legend { display: block; font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; line-height: 1.45; }
.question-hint { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 18px; background-color: var(--surface-alt); padding: 8px 12px; border-radius: var(--radius-sm); line-height: 1.5; }

.choice-options-list { display: flex; flex-direction: column; gap: 10px; }
.choice-option-label {
  display: flex; align-items: flex-start; padding: 14px 18px; border-radius: var(--radius-md);
  border: 1px solid var(--border-color); background-color: var(--surface-card); cursor: pointer;
  transition: all var(--transition-fast); min-height: 48px;
}
.choice-option-label:hover { background-color: var(--surface-alt); border-color: var(--border-focus); }
.choice-option-label input[type="radio"] { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 2px solid var(--border-focus); border-radius: 50%; margin-top: 2px; margin-right: 12px; flex-shrink: 0; display: grid; place-content: center; }
.choice-option-label input[type="radio"]::before { content: ""; width: 10px; height: 10px; border-radius: 50%; transform: scale(0); transition: transform var(--transition-fast); background-color: var(--accent-color); }
.choice-option-label input[type="radio"]:checked { border-color: var(--accent-color); }
.choice-option-label input[type="radio"]:checked::before { transform: scale(1); }
.choice-option-label.checked { border-color: var(--accent-color); background-color: var(--accent-light); }
.choice-text-wrap { flex: 1; }
.choice-primary-text { font-size: 0.96rem; font-weight: 500; line-height: 1.45; }

.scale-container { display: flex; flex-direction: column; gap: 12px; }
.scale-buttons-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale-btn-label {
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 6px;
  border-radius: var(--radius-md); border: 1px solid var(--border-color); background-color: var(--surface-card);
  cursor: pointer; transition: all var(--transition-fast); text-align: center; min-height: 54px;

.scale-btn-label input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
.scale-num { font-size: 1.15rem; font-weight: 700; line-height: 1; }
.scale-btn-label:hover { background-color: var(--surface-alt); border-color: var(--border-focus); }
.scale-btn-label.checked { background-color: var(--accent-color); border-color: var(--accent-color); }
.scale-btn-label.checked .scale-num { color: var(--accent-contrast); }
.scale-axis-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); padding: 0 4px; }

.form-nav-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 8px; }
.btn-secondary { background-color: var(--surface-card); color: var(--text-primary); border: 1px solid var(--border-color); padding: 13px 26px; font-size: 0.95rem; font-weight: 600; border-radius: var(--radius-pill); cursor: pointer; min-height: 48px; }
.btn-secondary:hover { background-color: var(--surface-alt); }
.btn-primary { background-color: var(--accent-color); color: var(--accent-contrast); border: none; padding: 13px 32px; font-size: 0.95rem; font-weight: 600; border-radius: var(--radius-pill); cursor: pointer; min-height: 48px; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background-color: var(--accent-hover); }

.validation-alert { display: none; background-color: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-color); padding: 12px 18px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 500; margin-bottom: 16px; }
.validation-alert.active { display: flex; align-items: center; gap: 8px; }

.loading-card { text-align: center; padding: 64px 24px; background-color: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); max-width: 560px; margin: 40px auto; box-shadow: var(--shadow-md); }
.spinner { width: 44px; height: 44px; border: 4px solid var(--border-color); border-top-color: var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 24px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; }
.loading-desc { font-size: 0.95rem; color: var(--text-muted); }

.success-banner { background-color: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 32px 24px; text-align: center; margin-bottom: 32px; box-shadow: var(--shadow-sm); }
.success-check-icon { width: 48px; height: 48px; background-color: var(--success-bg); color: var(--success-color); border-radius: 50%; display: grid; place-content: center; margin: 0 auto 16px; font-size: 1.5rem; font-weight: 700; }
.success-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
.success-subtext { font-size: 1rem; color: var(--text-secondary); }

.stats-header-wrap { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.stats-title { font-size: 1.4rem; font-weight: 700; }
.stats-sample-badge { font-size: 0.88rem; background-color: var(--surface-alt); padding: 6px 14px; border-radius: var(--radius-pill); color: var(--text-secondary); font-weight: 600; }

.insufficient-stats-box { background-color: var(--surface-card); border: 1px dashed var(--border-color); border-radius: var(--radius-md); padding: 32px 24px; text-align: center; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; }

.featured-stats-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
@media (min-width: 768px) { .featured-stats-grid { grid-template-columns: 1fr 1fr; } }
.stat-card { background-color: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 22px; box-shadow: var(--shadow-sm); }
.stat-card.featured { border-top: 3px solid var(--accent-color); }
.stat-card-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.stat-mean-badge { font-size: 0.8rem; font-weight: 600; color: var(--accent-color); background-color: var(--accent-light); padding: 3px 10px; border-radius: var(--radius-pill); }

.chart-bars-list { display: flex; flex-direction: column; gap: 12px; }
.chart-bar-item { display: flex; flex-direction: column; gap: 4px; }
.bar-label-line { display: flex; justify-content: space-between; font-size: 0.84rem; color: var(--text-secondary); }
.bar-label-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
.bar-val-text { font-weight: 600; color: var(--text-primary); }
.bar-track { width: 100%; height: 10px; background-color: var(--surface-alt); border-radius: var(--radius-pill); overflow: hidden; }
.bar-fill { height: 100%; background-color: var(--accent-color); border-radius: var(--radius-pill); width: 0%; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

.stats-detail-accordion { margin-top: 24px; }
.stats-accordion-btn { width: 100%; background-color: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px 20px; font-size: 0.95rem; font-weight: 600; color: var(--text-primary); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.all-stats-grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 16px; }
@media (min-width: 768px) { .all-stats-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
.stats-disclaimer { font-size: 0.82rem; color: var(--text-muted); text-align: center; margin-top: 32px; line-height: 1.5; }

.closed-card, .error-card { text-align: center; padding: 64px 24px; background-color: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); max-width: 560px; margin: 40px auto; box-shadow: var(--shadow-md); }
.error-title { color: var(--danger-color); font-size: 1.35rem; font-weight: 700; margin-bottom: 12px; }

.app-footer { border-top: 1px solid var(--border-color); padding: 24px 16px; text-align: center; font-size: 0.82rem; color: var(--text-muted); background-color: var(--surface-color); }
</style>
